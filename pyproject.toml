[project]
name = "ab-agent"
version = "0.1.0"
description = "A/B testing and causal inference toolkit, with an AI agent on top"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stefan Vujadinovic", email = "vujadinovicstefan01@gmail.com" },
    {name = "Marko Milinic", email = "milinicmarko1@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.18.1",
]

[project.scripts]
ab-agent = "ab_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
